    <section class="space-y-3"><h3 class="text-xs font-bold text-slate-900">Price Range (Cr)</h3><div class="grid grid-cols-2 gap-3"><input type="number" id="map-price-min" min="0" step="0.1" placeholder="Min" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-slate-900"><input type="number" id="map-price-max" min="0" step="0.1" placeholder="Max" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-slate-900"></div></section>
    <section class="space-y-3"><h3 class="text-xs font-bold text-slate-900">Listing Intent</h3><div class="flex gap-2"><button type="button" class="map-filter-chip" data-filter-group="intent" data-filter-value="all" aria-pressed="true">All</button><button type="button" class="map-filter-chip" data-filter-group="intent" data-filter-value="Buy" aria-pressed="false">Buy</button><button type="button" class="map-filter-chip" data-filter-group="intent" data-filter-value="Rent" aria-pressed="false">Rent</button></div></section>
  </div>
  <div class="map-filter-actions"><button id="map-filter-clear" type="button" class="px-3 py-3 text-sm font-bold text-slate-500 hover:text-slate-900">Clear filters</button><button id="map-filter-apply" type="button" class="min-h-12 rounded-xl bg-slate-900 px-7 py-3 text-sm font-bold text-white shadow-sm hover:bg-slate-800">Apply filters</button></div>
</aside>
